[project]
name = "agent-genie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "cohere>=7.0.4",
    "fastapi>=0.137.1",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "poetry>=2.4.1",
    "pypoet>=0.3.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
    "poethepoet>=0.37.0",
    "ruff>=0.13.2",
    "mypy>=1.18.2",
]




[app.cohere]
model = "embed-v4.0"
api_key="f3XH"

[app.chromadb]
collection_name = "document_chunks"
persist_directory = "./chroma_db"

[app.groq]
api_key = "gsGb"
model = "llama-3.3-70b-versatile"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "poethepoet>=0.37.0",
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.poe.tasks]

fix.shell = """
ruff format .
ruff check . --fix
"""

check.shell = """
ruff format . --check
ruff check .
mypy .
"""

validate.sequence = [
    "fix",
    "check",
]